name: Booking and native graph regression tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.freeze.txt
      - run: python -m pip install -r requirements.freeze.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/prepare_upstream.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_evidence.py
